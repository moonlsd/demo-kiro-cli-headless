spring.application.name=demo
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Datasource (H2 in-memory for the demo; replace per environment)
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Schema is managed by Flyway migrations; never let JPA mutate or validate a real schema.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Order history pagination (KIRODEMO-003)
order-history.default-page-size=20
order-history.max-page-size=100
